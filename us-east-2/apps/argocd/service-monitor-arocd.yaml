apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-monitor
  namespace: argocd
spec:
  destination:
    namespace: spring-petclinic
    server: https://kubernetes.default.svc
  project: spring-petclinic
  source:
    path: us-east-2/apps/service-monitor
    repoURL: git@github.com:AI-runner-11/k8s-deployment.git
    targetRevision: HEAD
  
  syncPolicy:
    automated:
      prune: true  
      selfHeal: true