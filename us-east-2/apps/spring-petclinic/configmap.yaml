apiVersion: v1
data:
  APPLICATION_NAME: spring-petclinic
  APPLICATION_VERSION: 0.1.0
  DATABASE: postgres
  SPRING_DATASOURCE_URL: jdbc:postgresql://petclinic-qa-postgresql.cudazhvkdzgr.us-east-2.rds.amazonaws.com:5432/petclinic
  # SQL is written to be idempotent so this is safe
  SPRING_SQL_INIT_MODE: always
    # Web
  SPRING_THYMELEAF_MODE: HTML
    # JPA
  SPRING_JPA_HIBERNATE_DDL-AUTO: none
    # Internationalization
  SPRING_MESSAGES_BASENAME: messages/messages
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
    # logging.level.org.springframework.web=DEBUG
    # logging.level.org.springframework.context.annotation=TRACE

    # Maximum time static resources should be cached
  SPRING_WEB_RESOURCES_CACHE_CACHECONTROL_MAX-AGE: 12h
kind: ConfigMap
metadata:
  annotations:
  labels:
    app.kubernetes.io/instance: spring-petclinic-service
    app.kubernetes.io/name: spring-petclinic
    app: spring-petclinic
  name: spring-petclinic-config
  namespace: spring-petclinic