apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spring-petclinic-service
  namespace: spring-petclinic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spring-petclinic-service
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource