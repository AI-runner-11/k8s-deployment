apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-service
  namespace: spring-petclinic
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: spring-petclinic-service
      app.kubernetes.io/name: spring-petclinic
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app.kubernetes.io/instance: spring-petclinic-service
        app.kubernetes.io/name: spring-petclinic
    spec:
      containers:
      - env:
        - name: SPRING_JPA_JDBC_TIME_ZONE
          value: UTC
        envFrom:
        - configMapRef:
            name: spring-petclinic-config
        - secretRef:
            name: spring-petclinic-secrets
        image: 203360591048.dkr.ecr.us-east-2.amazonaws.com/spring-petclinic:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /actuator/health/liveness
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        name: address
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 20
          httpGet:
            path: /actuator/health/readiness
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 1400Mi
          requests:
            cpu: 50m
            memory: 850Mi
        securityContext: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      nodeSelector:
        eks.blinkng.nodetype: backend
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30